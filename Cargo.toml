[package]
name = "chatix-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["io-util"] }
thiserror = "2.0.20"
zeroize = { version = "1.9.0", features = ["derive"] }
ring = "0.17"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
hkdf = "0.13.0"
sha2 = "0.11.0"
ml-kem = { version = "0.3", features = ["getrandom"] }
ml-dsa = { version = "0.1.1", features = ["zeroize"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
